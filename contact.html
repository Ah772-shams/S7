<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ville Heikkiniemi">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">

    <title>Contact | Centria Edu</title>
</head>

<body>

    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    centria <span>edu</span>
                </div>

                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#topics">Topics</a></li>
                    <li><a href="index.html#about">About</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <div class="hero-content">
                    <span class="label">Basics of Web Development</span>
                    <h1>Get in touch</h1>
                    <p>Complete the form below and let us know how we can help. Fields marked as required must be filled in.</p>
                </div>
            </div>
        </section>

        <section class="topics" id="contact">
            <div class="container">
                <h2>Contact us</h2>

                <form class="card" action="https://httpbin.org/post" method="post">
                    <div class="form-field">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" autocomplete="name" required>
                    </div>

                    <div class="form-field">
                        <label for="email">Email address</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </div>

                    <div class="form-field">
                        <label for="phone">Phone number (optional)</label>
                        <input type="tel" id="phone" name="phone" autocomplete="tel">
                    </div>

                    <div class="form-field">
                        <label for="subject">Contact subject</label>
                        <select id="subject" name="subject" required>
                            <option value="">Choose a subject</option>
                            <option value="feedback">Feedback</option>
                            <option value="question">Question</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <fieldset class="form-field form-field--radio">
                        <legend>Preferred contact method</legend>
                        <label class="radio-option" for="contact-email">
                            <input type="radio" id="contact-email" name="preferred_contact" value="email">
                            Email
                        </label>
                        <label class="radio-option" for="contact-phone">
                            <input type="radio" id="contact-phone" name="preferred_contact" value="phone">
                            Phone
                        </label>
                    </fieldset>

                    <div class="form-field">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>

                    <button class="button form-submit" type="submit">Submit</button>
                </form>
            </div>
        </section>
    </main>

    <footer id="about">
        <div class="container">
            <p>&copy; Ahtasham Hussain 2026 Centria Edu</p>
        </div>
    </footer>

</body>
</html>
