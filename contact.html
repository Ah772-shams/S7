<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ahtasham - Web Development</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="fav.ico">
</head>

<body>

    <header>
       <h1>Contact Us</h1>
        <p>
          Have a question, suggestion, or feedback?
          Fill out the form below and we will be happy to hear from you.
        </p>
   
    </header>

<nav class="navbar">
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="gallery.html">Gallery</a></li>
       
        <li><a href="contact.html">Contact Us</a></li>
    </ul>

  
</nav>

    <main>

  <section class="topics" id="contact">
    <div class="container">

      <div class="section-heading">
        <span class="eyebrow">GET IN TOUCH</span>
       
      </div>

      <form class="card contact-form"
            action="https://httpbin.org/post"
            method="post">

        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            autocomplete="name"
            required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number (Optional)</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            autocomplete="tel">
        </div>

        <div class="form-group">
          <label for="subject">Contact Subject</label>
          <select id="subject" name="subject" required>
            <option value="">Choose a subject</option>
            <option value="general">General Inquiry</option>
            <option value="feedback">Feedback</option>
            <option value="support">Technical Support</option>
            <option value="other">Other</option>
          </select>
        </div>

        <fieldset class="form-group">
          <legend>Preferred Contact Method</legend>

          <label>
            <input
              type="radio"
              name="contact_method"
              value="email"
              required>
            Email
          </label>

          <label>
            <input
              type="radio"
              name="contact_method"
              value="phone">
            Phone
          </label>
        </fieldset>

        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Write your message here..."
            required></textarea>
        </div>

        <button type="submit" class="submit-btn">
          Send Message
        </button>

      </form>

    </div>
  </section>

</main> 
    <footer>
        <p>Modified by: Ahtasham Hussain</p>
    </footer>
</body>
</html>
